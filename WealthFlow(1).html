</style></head><body><main id="app"></main>

if(j.m!=="online"){if(j.mq)o.push(["Google Maps","https://www.google.com/maps/search/?api=1&query="+e(j.mq+" near "+c)]);o.push(["Indeed near you","https://www.indeed.com/jobs?q="+e(j.kw||j.t)+"&l="+e(c)],["Facebook Marketplace","https://www.facebook.com/marketplace/search/?query="+e((j.kw||j.t)+" "+S.u.city)],["Nextdoor posts","https://www.google.com/search?q="+e('site:nextdoor.com "'+S.u.city+'" '+(j.kw||j.t))])}

const T=id=>S.jobs.find(x=>x.id===id),STG=["Saved","Reaching out","Working","Paid"];
